header:
   version: 1
machine: qemux86-64
distro: poky
build_system: oe
target: core-image-weston

repos:
   poky:
       url: "https://git.yoctoproject.org/poky"
       branch: "scarthgap"
       path: "poky-scarthgap"
       layers:
           meta:
           meta-poky:
           meta-yocto-bsp:
   meta-openembedded:
       url: "https://git.openembedded.org/meta-openembedded"
       branch: "scarthgap"
       path: "poky-scarthgap/meta-openembedded"
       layers:
           meta-oe:
           meta-multimedia:
           meta-networking:
           meta-python:
           meta-perl:
           meta-filesystems:
           meta-gnome:
   meta-virtualization:
       url: "https://git.yoctoproject.org/meta-virtualization"
       branch: "scarthgap"
       path: "poky-scarthgap/meta-virtualization"
   meta-security:
       url: "https://git.yoctoproject.org/meta-security"
       branch: "scarthgap"
       path: "poky-scarthgap/meta-security"

bblayers_conf_header:
   custom-bblayers-conf: |
       POKY_BBLAYERS_CONF_VERSION = "2"

local_conf_header:
   custom-local-conf: |
       DISTRO_FEATURES = " \
           security \
           systemd \
           usbhost \
           wayland \
           xwayland \
           opengl \
           eglfs \
           vulkan \
           virtualization \
           avahi \
           seccomp \
           wifi \
           polkit \
           pam \
           plymouth \
           ${DISTRO_FEATURES_LIBC} \
       "
       DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio sysvinit"
       PACKAGECONFIG:append = " weston"
       INIT_MANAGER = "systemd"
       VIRTUAL-RUNTIME_init_manager = "systemd"
       VIRTUAL-RUNTIME_initscripts = ""
       MACHINE_FEATURES:append = " x86"
       IMAGE_FSTYPES = "tar.bz2 ext4 wic wic.bmap"
       IMAGE_INSTALL:append = " systemd openssh-sftp-server openssh-sshd sudo python3 python3-pip coreutils bash busybox util-linux linux-firmware kernel-image kernel-modules gcc g++ make cmake openssh rsync git strace net-tools iputils which gzip wget zlib patchelf curl packagegroup-core-buildessential avahi-daemon kmod"
       IMAGE_FEATURES:append = " package-management ssh-server-openssh"
       IMAGE_FEATURES:remove = " debug-tweaks ssh-server-dropbear"
       SDKMACHINE = "x86_64"
       PACKAGE_CLASSES ?= "package_deb"
       USER:CLASSES = "image-mklibs image-prelink"
       PATCHRESOLVE = "noop"
       RM_OLD_IMAGE = "1"
       CONF_VERSION = "2"
       LICENSE_FLAGS_ACCEPTED = "commercial"
       IMAGE_ROOTFS_EXTRA_SPACE = "1048576"
       TOOLCHAIN_HOST_TASK:append = "nativesdk-kmod"
       export PATH = "/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin"
       CORE_IMAGE_EXTRA_INSTALL = " \
           mesa \
           libdrm \
           wayland \
           wayland-protocols \
           openssh \
           openvpn \
           wayland-utils \
           weston \
           weston-init \
           libgles2 \
           libegl \
           libinput \
           json-c \
       "
       IMAGE_INSTALL:append = " python3-dev \
           python3-fcntl \
           python3-core \
           python3-wheel \
           python3-setuptools \
       "
       BB_NO_NETWORK = "0"
       EXTRA_IMAGE_FEATURES += "tools-sdk dev-pkgs"
       IMAGE_INSTALL:append = " weston weston-init"
       IMAGE_INSTALL:append = " weston-examples"
       IMAGE_INSTALL:append = " mingetty "
       SYSTEMD_AUTO_ENABLE:remove = "getty@.service"

       # Reduce disk usage for CI builds
       INHERIT += "rm_work"
       BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},500M,10K HALT,${DL_DIR},500M,10K HALT,${SSTATE_DIR},500M,10K"
       BB_GENERATE_MIRROR_TARBALLS = "0"
       BB_NUMBER_THREADS = "4"
       PARALLEL_MAKE = "-j 4"
