CONFIG_BMP_32BPP=y
CONFIG_CMD_BMP=y
CONFIG_VIDEO=y
CONFIG_SYS_VIDEO_LOGO_MAX_SIZE=3145728
CONFIG_VIDEO_BCM2835=y
CONFIG_SYS_WHITE_ON_BLACK=y
